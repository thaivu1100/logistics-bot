<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kho Hàng Logistics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script src='//libtl.com/sdk.js' data-zone='11457064' data-sdk='show_11457064'></script>
    <script src='//libtl.com/sdk.js' data-zone='10406527' data-sdk='show_10406527'></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 15% 0%, #1e293b 0%, #0f172a 45%, #0b1120 100%); background-attachment: fixed; color: white; user-select: none; }
        .glass { background: linear-gradient(160deg, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.75) 100%); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 24px rgba(0,0,0,0.25); transition: box-shadow 0.2s ease, transform 0.2s ease; }
        .gold-glow { box-shadow: 0 0 34px rgba(251, 191, 36, 0.45), inset 0 1px 0 rgba(255,255,255,0.25); border: 1px solid rgba(251, 191, 36, 0.35); }
        .neon-blue { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35); }
        .text-neon { text-shadow: 0 0 10px rgba(251, 191, 36, 0.8); color: #fbbf24; }
        button { transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease; }
        button:active { transform: scale(0.95); filter: brightness(0.95); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(251, 191, 36, 0.4); border-radius: 10px; }
        @keyframes floatingBox { 0%, 100% { transform: translateY(0) scale(1) rotate(0deg); } 50% { transform: translateY(-20px) scale(1.1) rotate(5deg); } }
        .float-box { animation: floatingBox 4s ease-in-out infinite; cursor: pointer; }
        .nav-scroll::-webkit-scrollbar { display: none; }
        .progress-bar { transition: width 0.5s ease; }
        .coin-float { position: absolute; font-size: 2.5rem; animation: floatAround 8s ease-in-out infinite; cursor: pointer; z-index: 100; pointer-events: auto; filter: drop-shadow(0 0 15px #fbbf24); }
        @keyframes floatAround { 0% { transform: translate(0, 0) scale(1); } 25% { transform: translate(20px, -30px) scale(1.1); } 50% { transform: translate(-10px, -50px) scale(1); } 75% { transform: translate(30px, -20px) scale(1.05); } 100% { transform: translate(0, 0) scale(1); } }
        .rank-1 { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
        .rank-2 { background: linear-gradient(135deg, #94a3b8, #64748b); }
        .rank-3 { background: linear-gradient(135deg, #cd7f32, #b45309); }
        .chest-container { position: relative; width: 200px; height: 200px; margin: 0 auto; cursor: pointer; }
        .chest { width: 100%; height: 100%; position: relative; transition: transform 0.3s; display: flex; align-items: center; justify-content: center; }
        .chest.shaking { animation: shake 0.5s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
        .chest-open { animation: chestOpen 0.5s ease-out; }
        @keyframes chestOpen { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        
        /* Animation giao hàng */
        .delivery-animation { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .delivery-scene { position: relative; width: 100%; max-width: 400px; height: 120px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 10px; }
        .factory { font-size: 3rem; z-index: 10; margin-bottom: 10px; }
        .house { font-size: 3rem; z-index: 10; margin-bottom: 10px; }
        .conveyor { position: absolute; bottom: 15px; left: 50px; right: 50px; height: 8px; background: repeating-linear-gradient(90deg, #475569 0px, #475569 8px, #64748b 8px, #64748b 16px); border-radius: 4px; border: 1px solid #334155; }
        .box-on-conveyor { position: absolute; bottom: 23px; left: 50px; font-size: 1.2rem; animation: moveBox 1.5s linear infinite; }
        @keyframes moveBox { 0% { left: 50px; opacity: 1; } 70% { left: calc(100% - 90px); opacity: 1; } 100% { left: calc(100% - 70px); opacity: 0; } }
        .delivery-truck { position: absolute; bottom: 10px; left: 15%; transform: translateX(-50%); font-size: 2.5rem; transition: left 2s ease-in-out; z-index: 20; }
        .delivery-truck.moving { left: 85%; }
        
        /* Animation băng chuyền khi đang sản xuất */
        .conveyor-belt-anim { margin: 10px auto; width: 70%; height: 60px; background: #555; border-radius: 20px; position: relative; overflow: hidden; border: 2px solid #334155; }
        .conveyor-belt-anim .conveyor-line { position: absolute; bottom: 10px; left: 10px; right: 10px; height: 6px; background: repeating-linear-gradient(90deg, #475569 0px, #475569 8px, #64748b 8px, #64748b 16px); border-radius: 3px; }
        .conveyor-belt-anim .conveyor-goods { position: absolute; top: 5px; font-size: 1.5rem; animation: conveyorMove 3s linear infinite; }
        .conveyor-belt-anim .conveyor-goods:nth-child(3) { animation-delay: 1s; }
        .conveyor-belt-anim .conveyor-goods:nth-child(4) { animation-delay: 2s; }
        @keyframes conveyorMove { 0% { left: -20px; } 100% { left: calc(100% - 20px); } }
        .conveyor-belt-anim .truck-mini { position: absolute; right: 10px; bottom: 2px; font-size: 1.8rem; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #1e293b; border-radius: 25px; padding: 25px; max-width: 300px; width: 100%; text-align: center; border: 2px solid #fbbf24; box-shadow: 0 0 40px rgba(251, 191, 36, 0.3); }
        .banner-notification { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #0f172a; padding: 12px 24px; border-radius: 15px; font-weight: 900; font-size: 12px; z-index: 5000; box-shadow: 0 4px 20px rgba(251, 191, 36, 0.5); animation: slideDown 0.3s ease-out; max-width: 90%; text-align: center; }
        @keyframes slideDown { from { transform: translateX(-50%) translateY(-20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
        .coin-icon { display: inline-block; width: 16px; height: 16px; margin-right: 4px; vertical-align: middle; }
        
        /* Banner tham gia nhóm - có nút X để tắt */
        .join-banner { position: fixed; top: 0; left: 0; right: 0; z-index: 1500; background: linear-gradient(135deg, #1e40af, #1e3a8a); color: white; padding: 10px 40px 10px 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .join-banner-close { position: absolute; top: 8px; right: 10px; background: rgba(255,255,255,0.2); width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; font-size: 14px; }
        .join-banner-close:hover { background: rgba(255,255,255,0.3); }
        .join-banner-btns { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
        .join-banner-btns a, .join-banner-btns button { font-size: 10px; padding: 4px 10px; border-radius: 6px; font-weight: bold; }
        
        @media (max-width: 480px) {
            .main-container { max-width: 100%; padding: 0; }
            .header-text { font-size: 9px; }
            .btn-text { font-size: 11px; }
            .card-padding { padding: 10px; }
        }

        /* Hiệu ứng đẹp hơn cho các mục, vẫn giữ chủ đề Kho Hàng */
        .glass { transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease; }
        .glass:active { transform: scale(0.98); }
        button { transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease; }
        button:active:not(:disabled) { transform: scale(0.95); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        main > div[x-show] { animation: fadeInUp 0.35s ease-out; }
        .chest-container:hover .chest { filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.6)); }
        nav button.text-blue-500 i { filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.8)); }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(251, 191, 36, 0.4); border-radius: 4px; }

        /* ==== Nâng cấp Layout / Icon / Animation (giữ chủ đề Kho Hàng - Giao Hàng) ==== */
        @keyframes valuePop { 0% { transform: scale(1); } 45% { transform: scale(1.35); color: #4ade80; } 100% { transform: scale(1); } }
        .value-pop { animation: valuePop 0.45s ease-out; display: inline-block; }

        @keyframes warehousePulse { 0%, 100% { box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35); } 50% { box-shadow: 0 4px 24px rgba(37, 99, 235, 0.7); } }
        .neon-blue { animation: warehousePulse 2.8s ease-in-out infinite; }

        .nav-pill { position: absolute; inset: -6px -10px; border-radius: 14px; background: linear-gradient(135deg, rgba(59,130,246,0.22), rgba(37,99,235,0.08)); z-index: -1; animation: fadeInUp 0.25s ease-out; }
        nav button { position: relative; }

        @keyframes truckDrive { 0% { transform: translateX(0); } 50% { transform: translateX(2px) rotate(-1deg); } 100% { transform: translateX(0); } }
        .truck-idle { animation: truckDrive 1.6s ease-in-out infinite; display: inline-block; }

        .stagger-item { opacity: 0; animation: fadeInUp 0.4s ease-out forwards; }

        /* ===== Khu vực Nhiệm vụ - chủ đề "con đường giao hàng" ===== */
        .task-card { position: relative; transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease; overflow: hidden; }
        .task-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(59,130,246,0.08), transparent 40%); pointer-events: none; }
        .task-card:active { transform: scale(0.98); }
        .task-card.task-claimable { border-color: rgba(251, 191, 36, 0.45); box-shadow: 0 0 18px rgba(251, 191, 36, 0.18); }
        .task-card.task-done { opacity: 0.55; }
        .task-icon-wrap { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: linear-gradient(145deg, rgba(59,130,246,0.28), rgba(37,99,235,0.06)); border: 1px solid rgba(59,130,246,0.28); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); }
        .task-icon-wrap.icon-done { background: linear-gradient(145deg, rgba(34,197,94,0.28), rgba(21,128,61,0.06)); border-color: rgba(34,197,94,0.35); }
        .task-once-badge { font-size: 6px; padding: 1px 5px; border-radius: 999px; background: rgba(244, 63, 94, 0.18); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.35); font-weight: 900; letter-spacing: 0.03em; }
        .task-route { position: relative; height: 6px; width: 100%; border-radius: 999px; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.16) 0 5px, transparent 5px 11px); overflow: visible; }
        .task-route-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #fbbf24, #f97316); transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 0 8px rgba(251,146,60,0.5); }
        .task-route-truck { position: absolute; top: 50%; transform: translate(-50%, -50%); font-size: 11px; transition: left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); filter: drop-shadow(0 0 3px rgba(251,191,36,0.9)); }
        .task-claim-btn { position: relative; overflow: hidden; }
        .task-claim-btn::after { content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent); animation: taskShine 1.8s ease-in-out infinite; }
        @keyframes taskShine { 0% { left: -60%; } 100% { left: 140%; } }
        .tasks-header-truck { animation: truckDrive 1.6s ease-in-out infinite; display: inline-block; }
    </style>
</head>
<body x-data="app()" x-init="initApp()">

    <div x-show="notification.show" x-transition class="banner-notification" x-text="notification.text" @click="notification.show = false"></div>

    <!-- MÀN HÌNH CHẶN KHI TÀI KHOẢN BỊ KHÓA (thay thế toàn bộ mini app, không hiện tên miền/nội dung app) -->
    <div x-show="bannedScreen" x-cloak class="fixed inset-0 z-[9999] bg-slate-950 flex flex-col items-center justify-center text-center p-6">
        <div class="text-6xl mb-4">❌</div>
        <h2 class="text-lg font-black text-red-400 uppercase mb-2" x-text="texts.bannedTitle"></h2>
        <p class="text-sm text-slate-300" x-text="texts.bannedDesc"></p>
        <a href="https://t.me/noameazonus" target="_blank" class="mt-4 px-4 py-2 bg-blue-600 rounded-xl font-black text-xs uppercase" x-text="texts.bannedContact"></a>
    </div>

    <!-- MODAL HỎI X2 ĐƠN HÀNG -->
    <div x-show="showX2Prompt" class="modal-overlay" x-cloak @click.self="skipX2Ad()">
        <div class="modal-content">
            <div class="text-6xl mb-3">🚚💨</div>
            <h3 class="text-lg font-black text-yellow-400 mb-2" x-text="texts.deliverySuccessTitle"></h3>
            <p class="text-sm text-slate-300 mb-4"><span x-text="texts.x2Question"></span> <span class="text-yellow-400 font-black">X2</span> <span x-text="texts.x2Suffix"></span></p>
            <div class="flex gap-2">
                <button @click="skipX2Ad()" class="flex-1 py-2 bg-slate-700 rounded-xl font-black text-sm" x-text="texts.noThanks"></button>
                <button @click="confirmX2Ad()" class="flex-1 py-2 gold-glow bg-[#fbbf24] text-slate-900 rounded-xl font-black text-sm" x-text="texts.watchAdX2Now"></button>
            </div>
        </div>
    </div>

    <!-- COIN BOX CONFIRMATION MODAL -->
    <div x-show="showCoinBoxModal" class="modal-overlay" x-cloak @click.self="showCoinBoxModal = false">
        <div class="modal-content">
            <div class="text-6xl mb-3">🎁</div>
            <h3 class="text-lg font-black text-yellow-400 mb-2" x-text="texts.coinBoxTitle"></h3>
            <p class="text-sm text-slate-300 mb-4" x-text="texts.coinBoxDesc"></p>
            <div class="flex gap-2">
                <button @click="showCoinBoxModal = false" class="flex-1 py-2 bg-slate-700 rounded-xl font-black text-sm" x-text="texts.later"></button>
                <button @click="openCoinBoxWithAd()" class="flex-1 py-2 gold-glow bg-[#fbbf24] text-slate-900 rounded-xl font-black text-sm" x-text="texts.watchAdGetGift"></button>
            </div>
        </div>

    </div>

    <!-- ANIMATION GIAO HÀNG (chỉ hiện khi ấn nút Giao Hàng) -->
    <div x-show="showDeliveryAnimation" class="delivery-animation" x-transition>
        <div class="delivery-scene">
            <div class="factory">🏭</div>
            <div class="conveyor">
                <div class="box-on-conveyor">📦</div>
                <div class="box-on-conveyor" style="animation-delay: 0.5s">📦</div>
                <div class="box-on-conveyor" style="animation-delay: 1s">📦</div>
            </div>
            <div class="delivery-truck" :class="{ 'moving': isTruckMoving }" x-text="truckIcon"></div>
            <div class="house">🏠</div>
        </div>
        <p class="text-white font-bold mt-4 animate-pulse" x-text="isTruckMoving ? '🚛 Đang vận chuyển đơn hàng đến nhà...' : '📦 Đang xếp hàng lên xe...'"></p>
    </div>

    <!-- BANNER THAM GIA NHÓM (bắt buộc để mở khóa Mini App, có nút X để tắt tạm thời) -->
    <div x-show="!joinedGroups && !dismissedJoinBanner" class="join-banner">
        <div class="join-banner-close" @click="dismissedJoinBanner = true">✕</div>
        <div class="font-black text-sm mb-1" x-text="texts.joinBannerTitle"></div>
        <div class="text-[10px] opacity-90 mb-1" x-text="texts.joinBannerDesc"></div>
        <div class="join-banner-btns">
            <a href="https://t.me/khohangkiemtien" target="_blank" class="bg-blue-500 text-white" x-text="texts.channel"></a>
            <a href="https://t.me/khohangchatkiemtien" target="_blank" class="bg-yellow-500 text-slate-900" x-text="texts.group"></a>
            <button @click="checkGroupMembership()" class="bg-green-500 text-white" x-text="texts.checkJoin"></button>
        </div>
    </div>

    <!-- BANNER QUẢNG BÁ XEM QC X2 (chỉ hiện khi đã vào được app, có nút X để tắt) -->
    <div x-show="joinedGroups && !dismissedPromoBanner" class="join-banner" style="background: linear-gradient(135deg, #16a34a, #15803d);">
        <div class="join-banner-close" @click="dismissedPromoBanner = true">✕</div>
        <div class="font-black text-sm mb-1" x-text="texts.promoBannerTitle"></div>
        <div class="text-[10px] opacity-90" x-text="texts.promoBannerDesc"></div>
    </div>

    <div x-show="joinedGroups && !bannedScreen" x-cloak class="main-container max-w-sm mx-auto min-h-screen pb-20 relative" :class="(joinedGroups && !dismissedPromoBanner) ? 'pt-20' : ''">
        <header class="p-2 flex justify-between items-center glass sticky top-0 z-[100] border-b-white/5 shadow-2xl">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 neon-blue rounded-xl flex items-center justify-center font-black italic shadow-lg text-base"><i class="fa-solid fa-warehouse"></i></div>
                <div>
                    <p class="font-bold text-xs tracking-tight flex items-center header-text"><span x-text="user.name || 'Shipper'"></span><span class="bg-blue-500/20 text-blue-400 text-[8px] px-2 py-0.5 rounded-full ml-2" x-text="'LV.' + truckLevel"></span></p>
                    <p class="text-[7px] font-bold text-slate-500 tracking-widest mt-0.5 italic" x-text="'ID: ' + user.id"></p>
                </div>
            </div>
            <div class="space-y-1">
                <div class="bg-slate-800/80 px-2 py-0.5 rounded-lg flex items-center border border-white/5 text-xs"><span class="font-black mr-1 text-blue-400" :class="ordersPopped ? 'value-pop' : ''" x-text="formatNumber(orders)"></span> 📦</div>
                <div class="bg-slate-800/80 px-2 py-0.5 rounded-lg flex items-center border border-white/5 text-xs"><span class="coin-icon">💰</span><span class="font-black text-yellow-500" :class="coinsPopped ? 'value-pop' : ''" x-text="formatNumber(coins)"></span></div>
            </div>
        </header>

        <div class="bg-slate-900/50 py-1 flex items-center overflow-hidden">
            <div class="text-[8px] font-bold uppercase text-yellow-500/80 italic tracking-widest whitespace-nowrap animate-marquee" x-text="bannerText" style="animation: marquee 15s linear infinite;"></div>
        </div>
        <style>@keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } } .animate-marquee { display: inline-block; padding-left: 100%; }</style>

        <main class="p-2 space-y-3">
            <!-- TRANG CHỦ -->
            <div x-show="tab === 'home'" x-transition class="space-y-3 relative">
                <div x-show="coinBoxVisible" @click="showCoinBoxModal = true" class="coin-float" :style="'top: ' + coinBoxY + 'px; left: ' + coinBoxX + 'px;'">🎁</div>
                <div class="p-4 rounded-[25px] neon-blue shadow-2xl relative overflow-hidden group card-padding">
                    <h3 class="text-[9px] font-black uppercase opacity-60 tracking-[4px]" x-text="texts.warehouse"></h3>
                    <h2 class="text-2xl font-black mt-1" x-text="texts.wallet"></h2>
                    <div class="mt-4"><span class="text-3xl font-extrabold tracking-tighter italic text-neon" x-text="formatNumber(orders)"></span><span class="text-[9px] opacity-40 ml-2 font-black italic" x-text="texts.orders"></span></div>
                    <div class="absolute -right-4 -bottom-4 text-[80px] opacity-10 group-hover:rotate-12 transition-all duration-700"></div>
                </div>
                <div class="glass p-3 rounded-[20px] flex justify-between items-center card-padding">
                    <div><p class="text-[7px] font-black uppercase opacity-50" x-text="texts.truckLevel"></p><p class="text-sm font-black italic text-blue-400" x-text="'🚛 ' + truckLevel + ' - ' + truckName"></p></div>
                    <div class="text-right"><p class="text-[7px] font-black uppercase opacity-50" x-text="texts.products"></p><p class="text-sm font-black text-yellow-400" x-text="formatNumber(currentProducts) + ' / ' + formatNumber(maxProducts)"></p></div>
                </div>
                
                <!-- BĂNG CHUYỀN SẢN XUẤT (hiện khi đang đếm ngược) -->
                <div x-show="currentProducts > 0 && currentProducts < maxProducts && !isShipping" class="conveyor-belt-anim">
                    <div class="conveyor-line"></div>
                    <div class="conveyor-goods">📦</div>
                    <div class="conveyor-goods" style="animation-delay: 1s;">📦</div>
                    <div class="conveyor-goods" style="animation-delay: 2s;">📦</div>
                    <div class="truck-mini" x-text="truckIcon"></div>
                </div>
                
                <div class="grid grid-cols-2 gap-2">
                    <div class="p-2 glass rounded-[20px] text-center card-padding"><p class="text-[6px] font-black uppercase opacity-40" x-text="texts.timeLeft"></p><p class="text-sm font-black text-blue-400" x-text="productionCountdown"></p></div>
                    <div class="p-2 glass rounded-[20px] text-center card-padding"><p class="text-[6px] font-black uppercase opacity-40" x-text="texts.prodMax"></p><p class="text-sm font-black text-yellow-400" x-text="formatNumber(currentProducts) + ' / ' + formatNumber(maxProducts)"></p></div>
                </div>
                <div class="space-y-2">

                startCountdown() {
                    const updateCountdown = () => {
                        const now = new Date();
                        const nextSunday = new Date(now);
                        nextSunday.setHours(0, 0, 0, 0);
                        const daysUntilSunday = (7 - now.getDay()) % 7; // 0 nếu hôm nay là Chủ Nhật
                        nextSunday.setDate(now.getDate() + daysUntilSunday);
                        // FIX LỖI: nếu mốc vừa tính ra đã ở QUÁ KHỨ so với hiện tại (tức đang là Chủ Nhật
                        // và đã qua 00:00, không chỉ riêng giờ đầu tiên) thì phải nhảy sang Chủ Nhật tuần sau.
                        // Trước đây chỉ kiểm tra "now.getHours() === 0" nên cả ngày Chủ Nhật (trừ giờ đầu)
                        // bị tính ra hiệu số ÂM, khiến đồng hồ đếm ngược hiển thị sai như đang tăng lên.
                        if (nextSunday <= now) {
                            nextSunday.setDate(nextSunday.getDate() + 7);
                        }
                        const diff = nextSunday - now;
                        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                        this.countdownText = `${days}ng ${hours}h ${minutes}m ${seconds}s`;
                    };
                    updateCountdown();
                    setInterval(updateCountdown, 1000);
                },

                shareInvite() {
                    const text = 'Tham gia Kho Hàng Logistics kiếm tiền cùng tôi! Link: https://t.me/' + BOT_USERNAME + '?start=' + this.user.id;
                    if (navigator.share) {
                        navigator.share({ title: 'Mời bạn tham gia', text: text })
                            .catch(err => {
                                console.error('Error sharing:', err);
                                this.showNotification('❌ Lỗi chia sẻ. Vui lòng copy thủ công.');
                            });
                    } else {
                        // Fallback to clipboard if share API is not available
                        navigator.clipboard?.writeText(text)
                            .then(() => this.showNotification('📋 Đã copy link mời!'))
                            .catch(err => console.error('Failed to copy text: ', err));
                    }
                },
                redeemGift() {
                    if (!this.giftCode.trim()) {
                        this.showNotification('❌ Vui lòng nhập mã code!');
                        return;
                    }
                    fetch(`${API_URL}/api/redeem-code`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: this.user.id, code: this.giftCode })
                    })
                    .then(res => res.json())
                    .then(result => {
                        if (result.success) {
                            this.coins += (result.rewardAmount || 0);
                            this.orders += (result.orders || 0);
                            this.spinFree += (result.spins || 0);
                            
                            let message = `🎁 Code thành công:`;
                            if (result.rewardAmount > 0) message += ` +${this.formatNumber(result.rewardAmount)} Coin`;
                            if (result.orders > 0) message += ` +${this.formatNumber(result.orders)} Đơn hàng`;
                            if (result.spins > 0) message += ` +${this.formatNumber(result.spins)} Lượt mở rương`;
                            
                            this.showNotification(message);
                            this.giftCode = '';
                            this.saveState();
                        } else {
                            this.showNotification('❌ ' + (result.error || 'Mã không hợp lệ!'));
                        }
                    })
                    .catch((e) => {
                        console.error("Lỗi redeem giftcode:", e);
                        this.showNotification('❌ Lỗi kết nối server khi đổi code.');
                    });
                },
                showNotification(text) {
                    this.notification.text = text;
                    this.notification.show = true;
                    setTimeout(() => { this.notification.show = false; }, 3000);
                },
                formatNumber(num) { 
                    if (typeof num !== 'number') return num; // Return as is if not a number
                    return new Intl.NumberFormat('vi-VN').format(num); 
                },
                async saveState() {
                    const data = {
                        // QUAN TRỌNG: các field phải nằm PHẲNG (top-level) để khớp với tên cột trong bảng
                        // Supabase "users". Trước đây các field này bị lồng trong object "user" khiến
                        // PostgREST từ chối TOÀN BỘ request update (vì cột "user" không tồn tại) ->
                        // đây chính là nguyên nhân dữ liệu không được lưu / bị mất khi khởi động lại bot.
                        name: this.user.name,
                        joinDate: this.user.joinDate,
                        referrerId: this.user.referrerId,
                        referrerCounted: this.user.referrerCounted,
                        coins: this.coins,
                        orders: this.orders,
                        spins: this.spinFree, // 'spins' in DB is 'spinFree' in frontend
                        truckLevel: this.truckLevel,
                        currentProducts: this.currentProducts,
                        lastProducedAt: this.lastProducedAt,
                        maxProducts: this.maxProducts,
                        productionInterval: this.productionInterval,
                        speedUpUsed: this.speedUpUsed,
                        productionAmount: this.productionAmount,
                        coinBoxVisible: this.coinBoxVisible,
                        spinAdCount: this.spinAdCount,
                        spinAdProgress: this.spinAdProgress,
                        spinHistory: this.spinHistory,
                        invitedCount: this.invitedCount,
                        validInvites: this.validInvites,
                        adsToday: this.adsToday,
                        smartlinksToday: this.smartlinksToday,
                        lifetimeAdsWatched: this.lifetimeAdsWatched,
                        bonusAdsToday: this.bonusAdsToday,
                        withdrawRemain: this.withdrawRemain,
                        withdrawHistory: this.withdrawHistory,
                        lastResetDate: this.lastResetDate,
                        lastWeekReset: this.lastWeekReset,
                        dailyTasks: this.dailyTasks,
                        allTasksClaimed: this.allTasksClaimed,
                        deliveryCount: this.deliveryCount,
                        smartlinkCount: this.smartlinkCount,
                        lastSmartlinkTime: this.lastSmartlinkTime,
                        usedSmartlinks: this.usedSmartlinks,
                        referralMilestones: this.referralMilestones, // Ensure milestones are saved
                        clientWalletSyncedAt: this.walletSyncedAt, // Mốc ví client biết gần nhất, để server chống ghi đè thay đổi của admin
                    };
                    try {
                        const res = await fetch(`${API_URL}/api/user/${this.user.id}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data)
                        });
                        if (res.status === 403) {
                            const errData = await res.json().catch(() => ({}));
                            if (errData.isBanned) {
                                this.bannedScreen = true;
                                return;
                            }
                        }
                        const result = await res.json().catch(() => null);
                        if (result?.walletOverridden && result.wallet) {
                            // Admin vừa sửa ví (coin/đơn hàng/level/khóa TK) sau lần đồng bộ trước -> lấy lại giá trị mới nhất
                            // (âm thầm đồng bộ lại, không hiện thông báo vì đây không phải phần thưởng)
                            this.coins = result.wallet.coins ?? this.coins;
                            this.orders = result.wallet.orders ?? this.orders;
                            this.spinFree = result.wallet.spins ?? this.spinFree;
                            this.truckLevel = result.wallet.truckLevel ?? this.truckLevel;
                            this.walletSyncedAt = result.wallet.walletUpdatedAt || this.walletSyncedAt;
                            if (result.wallet.isBanned) {
                                this.bannedScreen = true;
                            }
                        } else if (result?.walletUpdatedAt) {
                            this.walletSyncedAt = result.walletUpdatedAt;
                        }
                    } catch (e) { console.error("Lỗi lưu DB:", e); }
                },
                menuItems: [
                    { id: 'home', name: 'Trang chủ', icon: 'fa-solid fa-house-chimney-window' },
                    { id: 'chest', name: 'Rương', icon: 'fa-solid fa-gift' },
                    { id: 'tasks', name: 'Nhiệm vụ', icon: 'fa-solid fa-list-check' },
                    { id: 'leaderboard', name: 'BXH', icon: 'fa-solid fa-trophy' },
                    { id: 'friends', name: 'Mời bạn', icon: 'fa-solid fa-user-group' },
                    { id: 'withdraw', name: 'Rút tiền', icon: 'fa-solid fa-credit-card' },
                    { id: 'settings', name: 'Cài đặt', icon: 'fa-solid fa-gears' }
                ]
            };
        }
    </script>
</body>
</html>
