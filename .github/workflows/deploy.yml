name: Deploy Logistics Bot

on:
  push:
    branches:
      - main

concurrency:
  group: logistics-bot-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -Eeuo pipefail

            cd /opt/logistics-bot

            OLD_COMMIT="$(git rev-parse HEAD)"

            rollback() {
              echo "Deploy failed - rollback"
              git reset --hard "$OLD_COMMIT"
              npm install --omit=dev
              systemctl restart logistics-bot
            }

            trap rollback ERR

            git fetch origin main
            git checkout main
            git reset --hard origin/main

            npm install --omit=dev

            node --check server.js

            systemctl restart logistics-bot

            sleep 4

            systemctl is-active --quiet logistics-bot

            curl --fail --silent --max-time 10 \
              http://127.0.0.1:3000/ \
              > /dev/null

            curl --fail --silent --max-time 15 \
              https://logistics-bot-160-191-87-87.nip.io/ \
              > /dev/null

            trap - ERR

            echo "DEPLOY SUCCESS"
